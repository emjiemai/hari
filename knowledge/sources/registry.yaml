# Source registry (spec 2.0 §5, §7, §29, §30). Checked on 2026-11-13.
#
# Every entry is "reference": HARI keeps the title and the link, and nothing else. No text from these
# sources is downloaded, indexed or used for training until HR or the lawyer records the rights for
# that source and changes it here — reading a page in a browser is not a licence to index it (§5).
# To use a source: fill `rights` from its terms, set `approved_by` to a real person, set
# `status: active`, then add the approved text as a document in knowledge/docs with the same
# `source_id`. `python -m scripts.check_sources` checks this file.
#
# review: how often the entry is re-checked (§29 "Янгилаш тартиби").
# The links are the ones given in the spec; a local-law or UK-law caveat is in `note`.

